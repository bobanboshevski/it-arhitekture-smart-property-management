name: Properties MFE CI

on:
  workflow_call:
  workflow_dispatch:

env:
  IMAGE_NAME: properties-mfe
  CONTEXT_PATH: ./smart-hotel-frontend/properties-mfe

jobs:
  docker-build:
    name: Build & Push (${{ matrix.environment.name }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false

      matrix:
        environment:
          - name: local
            docker_tags: |
              latest
              ${{ github.sha }}
            api_gateway_url: http://localhost:3000/api/v1

          - name: openshift
            docker_tags: |
              openshift
            api_gateway_url: OPENSHIFT

    steps:
      # --------------------------------------------------------
      # Checkout source code
      # --------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # --------------------------------------------------------
      # Setup Docker Buildx
      # --------------------------------------------------------
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # --------------------------------------------------------
      # Docker Hub Login
      # --------------------------------------------------------
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # --------------------------------------------------------
      # Resolve API Gateway URL
      # --------------------------------------------------------
      - name: Resolve API Gateway URL
        id: api-url
        run: |
          if [ "${{ matrix.environment.api_gateway_url }}" = "OPENSHIFT" ]; then
            echo "url=${{ secrets.OPENSHIFT_API_GATEWAY_URL }}" >> $GITHUB_OUTPUT
          else
            echo "url=${{ matrix.environment.api_gateway_url }}" >> $GITHUB_OUTPUT
          fi

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ${{ env.CONTEXT_PATH }}
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ matrix.environment.tags }}
          build-args: |
            VITE_API_GATEWAY_URL=${{ steps.api-url.outputs.url }}
          cache-from: |
            type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ matrix.environment.name }}-buildcache
          cache-to: |
            type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ matrix.environment.name }}-buildcache,mode=max